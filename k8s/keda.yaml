# HEAD (round 3): rtzk-stan ScaledObject removed while KEDA holds rtzk-stan at 0 -> scaledobject-removed HIGH
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: rtzk-pass, namespace: rtzk-pass}
spec:
  scaleTargetRef: {name: rtzk-pass}
  minReplicaCount: 1
  maxReplicaCount: 2
  triggers:
  - type: cron
    metadata: {timezone: UTC, start: "0 * * * *", end: "59 * * * *", desiredReplicas: "1"}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: {name: rtzk-vault, namespace: rtzk}
spec:
  hashiCorpVault: {address: "http://vault.vault:8200", authentication: kubernetes, role: r, mount: kubernetes}
