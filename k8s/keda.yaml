# BASE: what main has today (mirrors the cluster)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: rtzk-pass, namespace: rtzk-pass}
spec:
  scaleTargetRef: {name: rtzk-pass}
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
  - type: cron
    metadata: {timezone: UTC, start: "0 * * * *", end: "59 * * * *", desiredReplicas: "1"}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: rtzk-stan, namespace: rtzk}
spec:
  scaleTargetRef: {name: rtzk-stan}
  triggers:
  - type: cron
    metadata: {timezone: UTC, start: "0 * * * *", end: "5 * * * *", desiredReplicas: "1"}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: {name: rtzk-vault, namespace: rtzk}
spec:
  hashiCorpVault: {address: "http://vault.vault:8200", authentication: kubernetes, role: r, mount: kubernetes}
