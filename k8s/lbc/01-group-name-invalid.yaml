apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr1
  namespace: rtzlbc
  annotations: 
    alb.ingress.kubernetes.io/group.name: "Public_Web"
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
---
