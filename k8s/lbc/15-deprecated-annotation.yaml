# 15 wrs-addon-awslbc-deprecated-annotation (LOW): positive = a controller-owned NLB Service still on the deprecated
# cross-zone and aws-load-balancer-internal keys; near-miss = the same keys on a classless Service (the in-tree
# provider's Classic ELB keys, not deprecated there) — must stay silent.
apiVersion: v1
kind: Service
metadata:
  name: dep15
  namespace: rtzlbc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector: {app: okapp}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: dep15-intree
  namespace: rtzlbc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  selector: {app: okapp}
  ports: [{port: 80, targetPort: 80}]
